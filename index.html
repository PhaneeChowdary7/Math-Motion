<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clean interactive math visualizations built with React and D3." />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f16" media="(prefers-color-scheme: dark)" />
    <title>Math Motion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%278%27%20fill%3D%27%230f8f68%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M3.5%2027V6L16%2012.5L28.5%206V27%27%20stroke-width%3D%273.4%27%2F%3E%3Cpath%20d%3D%27M10%2025V16.5L16%2020.5L22%2016.5V25%27%20stroke-width%3D%272.5%27%20opacity%3D%270.72%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />

    <script>
      
      try {
        document.documentElement.dataset.theme = localStorage.getItem('math-motion-theme') || 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>

    <style>
      
      html { background: #eef2f7; }
      html[data-theme='dark'] { background: #0b0f16; }
      body { margin: 0; }
      .boot {
        align-items: center;
        color: #64748b;
        display: flex;
        font: 500 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        gap: 14px;
        justify-content: center;
        min-height: 100vh;
      }
      .boot-mark {
        animation: boot-pulse 1.4s ease-in-out infinite;
        background: linear-gradient(135deg, #0f8f68, #086348);
        border-radius: 12px;
        height: 34px;
        width: 34px;
      }
      @keyframes boot-pulse {
        50% { opacity: 0.45; transform: scale(0.94); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark"></div>
        <p>Loading interactive lesson…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
